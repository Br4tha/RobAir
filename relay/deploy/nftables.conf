#!/usr/sbin/nft -f
# Pare-feu du mini-serveur (J1 §2.3) : seul le port 443 est ouvert depuis Internet.
# SSH reste accessible UNIQUEMENT depuis le réseau local (adapter 192.168.1.0/24).
flush ruleset
table inet filter {
  chain input {
    type filter hook input priority 0; policy drop;
    iif lo accept
    ct state established,related accept
    ct state invalid drop
    tcp dport 443 accept
    ip saddr 192.168.1.0/24 tcp dport 22 accept
    icmp type echo-request limit rate 5/second accept
    icmpv6 type { echo-request, nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert } accept
  }
  chain forward { type filter hook forward priority 0; policy drop; }
  chain output { type filter hook output priority 0; policy accept; }
}
